services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: camcare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  camcare-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: camcare-sql
    restart: always
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  camcare:
    image: ghcr.io/sg-app/camcare:pre
    container_name: camcare
    restart: always
    depends_on:
      camcare-sql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default="Server=camcare-sql;Database=CamCare;User Id=sa;Password=${SA_PASSWORD}"
      - ConnectionStrings__AmicronDatabase=PathToFireBirdDb
      - ConnectionStrings__DefaultKrd="Server=camcare-sql;Database=Krd;User Id=sa;Password=${SA_PASSWORD}"
      - ObjectStorage__Endpoint=http://minio:9000
    ports:
      - 8085:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  minio-data:
