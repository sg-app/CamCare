name: CI / CD

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  gitversion:
    name: GitVersion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      major: ${{ steps.gitversion.outputs.major }}
      minor: ${{ steps.gitversion.outputs.minor }}
      patch: ${{ steps.gitversion.outputs.patch }}
      preReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}
      isPreRelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download shared GitVersion config
        run: |
          curl -sSfL -H "Authorization: Bearer ${{ secrets.SHAREDREPOTOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o GitVersion.yml \
            "https://api.github.com/repos/sg-app/Shared/contents/GitVersion.yml?ref=main"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Output Version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "IsPreRelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}"


  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-restore --verbosity normal

  docker:
    name: Build and Push Docker Image
    needs: [gitversion, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      tags: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Docker Tags
        id: determine-tags
        run: |
          SEMVER="${{ needs.gitversion.outputs.semVer }}"
          MAJOR_MINOR_PATCH="${{ needs.gitversion.outputs.majorMinorPatch }}"
          MAJOR="${{ needs.gitversion.outputs.major }}"
          MINOR="${{ needs.gitversion.outputs.minor }}"
          {
            echo "tags<<EOF"
            if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
              # Develop: pre, develop und vollständige Pre-Release-Version
              echo "type=raw,value=pre"
              echo "type=raw,value=develop"
              echo "type=raw,value=$SEMVER"
            elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              # Main: latest und vollständige SemVer-Tags
              echo "type=raw,value=latest"
              echo "type=raw,value=$MAJOR"
              echo "type=raw,value=$MAJOR.$MINOR"
              echo "type=raw,value=$MAJOR_MINOR_PATCH"
            else
              # Feature-Branches: nur Branch-Name als Tag (wird nicht gepusht)
              echo "type=raw,value=${{ github.ref_name }}"
            fi
            echo "EOF"
          } >> $GITHUB_ENV
          echo "Version: $SEMVER"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: ${{ env.tags }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64
          context: .
          file: "./CamCare/Dockerfile"
          push: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')  && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
          sbom: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')  && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
          provenance: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')  && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FULL_SEMVER=${{ needs.gitversion.outputs.semVer }}

  release:
    name: Create Release
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
    needs: [gitversion, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SEMVER: ${{ needs.gitversion.outputs.semVer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download shared git-cliff config
        run: |
          curl -sSfL -H "Authorization: Bearer ${{ secrets.SHAREDREPOTOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o cliff.toml \
            "https://api.github.com/repos/sg-app/Shared/contents/cliff.toml?ref=main"

      - name: Generate Changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.2.0
        with:
          tag_name: ${{ env.SEMVER }}
          name: Release ${{ env.SEMVER }}
          body_path: CHANGELOG.md
          prerelease: ${{ github.ref != 'refs/heads/main' }}
