name: Build and Publish image to Github container repository

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-restore --verbosity normal

  semantic-version:
    name: Semantic Versioning
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new_version: ${{ steps.get-version.outputs.new_version }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install -g semantic-release semantic-release-dotnet @semantic-release/git @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Get current latest tag
        id: before
        run: |
          TAG=$(git ls-remote --tags origin | grep -oP 'refs/tags/v\K[0-9.]+(-beta\.[0-9]+)?' | sort -V | tail -1 || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Current tag: $TAG"

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get new latest tag
        id: after
        run: |
          TAG=$(git ls-remote --tags origin | grep -oP 'refs/tags/v\K[0-9.]+(-beta\.[0-9]+)?' | sort -V | tail -1 || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "New tag: $TAG"

      - name: Determine version
        id: get-version
        run: |
          if [[ "${{ steps.before.outputs.tag }}" != "${{ steps.after.outputs.tag }}" ]]; then
            echo "new_version=${{ steps.after.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "New version: ${{ steps.after.outputs.tag }}"
          else
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "No new version"
          fi

  deploy:
    name: Deploy to GitHub Container Registry
    needs: [build, semantic-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout updated code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Determine Docker Tags
        id: determine-tags
        run: |
          NEW_VERSION="${{ needs.semantic-version.outputs.new_version }}"
          if [[ -n "$NEW_VERSION" ]]; then
            if [[ "$NEW_VERSION" == *"beta"* ]]; then
              CHANNEL="pre"
            else
              CHANNEL="latest"
            fi
            {
              echo "tags<<EOF"
              echo "type=raw,value=$CHANNEL"
              echo "type=semver,pattern={{version}},value=$NEW_VERSION"
              echo "type=semver,pattern={{major}}.{{minor}},value=$NEW_VERSION"
              echo "type=semver,pattern={{major}},value=$NEW_VERSION"
              echo "EOF"
            } >> $GITHUB_ENV
          else
            echo "tags=type=raw,value=latest" >> $GITHUB_ENV
          fi
          echo "Version: $NEW_VERSION"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: ${{ env.tags }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: "./CamCare/Dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
