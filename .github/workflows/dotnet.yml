name: CI / CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-restore --verbosity normal

  semantic-version:
    name: Semantic Versioning
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new_version: ${{ steps.get-version.outputs.new_version }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install -g semantic-release semantic-release-dotnet @semantic-release/git @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github

      - name: Get current latest tag
        id: before
        run: |
          TAG=$(git ls-remote --tags origin | grep -oP 'refs/tags/v\K[0-9.]+(-beta\.[0-9]+)?' | sort -V | tail -1 || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Current tag: $TAG"

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get new latest tag
        id: after
        run: |
          TAG=$(git ls-remote --tags origin | grep -oP 'refs/tags/v\K[0-9.]+(-beta\.[0-9]+)?' | sort -V | tail -1 || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "New tag: $TAG"

      - name: Determine version
        id: get-version
        run: |
          if [[ "${{ steps.before.outputs.tag }}" != "${{ steps.after.outputs.tag }}" ]]; then
            echo "new_version=${{ steps.after.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "New version: ${{ steps.after.outputs.tag }}"
          else
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "No new version"
          fi

  deploy:
    name: Deploy to GitHub Container Registry
    needs: [build, semantic-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout updated code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Determine Docker Tags
        id: determine-tags
        run: |
          NEW_VERSION="${{ needs.semantic-version.outputs.new_version }}"
          if [[ -n "$NEW_VERSION" ]]; then
            if [[ "$NEW_VERSION" == *"beta"* ]]; then
              CHANNEL="pre"
            else
              CHANNEL="latest"
            fi
            {
              echo "tags<<EOF"
              echo "type=raw,value=$CHANNEL"
              echo "type=semver,pattern={{version}},value=$NEW_VERSION"
              echo "type=semver,pattern={{major}}.{{minor}},value=$NEW_VERSION"
              echo "type=semver,pattern={{major}},value=$NEW_VERSION"
              echo "EOF"
            } >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tags=type=raw,value=develop" >> $GITHUB_ENV
          else
            echo "tags=type=raw,value=latest" >> $GITHUB_ENV
          fi
          echo "Version: $NEW_VERSION"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: ${{ env.tags }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64
          context: .
          file: "./CamCare/Dockerfile"
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
